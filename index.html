<style>
body{margin:0;background:#f4f6f8;color:#16202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:14px 12px 95px}
.card{background:white;border:1px solid #d7dde4;border-radius:16px;padding:14px;margin:10px 0}
h1{font-size:23px;margin:4px 0 12px}
label{font-weight:700;font-size:14px;display:block;margin-bottom:6px}
input{width:100%;min-height:50px;border:1px solid #c7ced6;border-radius:12px;padding:10px 12px;font-size:18px;box-sizing:border-box}
button{min-height:48px;border:0;border-radius:12px;padding:10px 15px;font-size:16px;font-weight:700}
.primary{background:#1f6feb;color:white} .secondary{background:#e9eef4}
.results{margin-top:8px;border:1px solid #d7dde4;border-radius:12px;overflow:hidden}
.result{padding:13px;border-bottom:1px solid #e1e5e9}
.result:last-child{border-bottom:0}
.result b{display:block} .result small{color:#65717d}
.selected{margin-top:8px;background:#eef5ff;border:1px solid #b8d2fb;padding:11px;border-radius:12px}
.grid{display:grid;grid-template-columns:110px 1fr;gap:10px}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.order{padding:10px 0;border-bottom:1px solid #e1e5e9;display:grid;grid-template-columns:55px 1fr 40px;gap:8px}
.order .q{font-weight:800;text-align:center}
.muted{color:#65717d;font-size:13px}
.sticky{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #d7dde4;padding:10px 12px}
.sticky div{max-width:760px;margin:auto;display:flex;gap:8px} .sticky button{flex:1}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>

<div class="actions">

</div>
</div>
<div class="card">
<label>Pedido actual</label>
<div id="order"></div>

</div>
</main>

</div></div>

const prefs=JSON.parse(localStorage.getItem("pedidoPrefs")||"{}");
let selected=null, matches=[], order=[];
const $=x=>document.getElementById(x);
function key(p){return p.code||p.barcode||p.description}
function fmt(p){return p.description+(p.code?" · Código "+p.code:"")}
function searchNow(){const q=$("search").value.trim().toLowerCase();$("results").innerHTML="";selected=null;$("selected").hidden=true;if(!q){$("results").hidden=true;return}
let exact=CATALOG.find(p=>[p.code,p.barcode,p.barcode2].filter(Boolean).some(v=>v.toLowerCase()===q));
matches=exact?[exact]:CATALOG.filter(p=>(p.description+" "+p.code+" "+p.barcode+" "+p.barcode2).toLowerCase().includes(q)).slice(0,50);
matches.forEach((p,i)=>{let d=document.createElement("div");d.className="result";d.innerHTML="<b></b><small></small>";d.querySelector("b").textContent=p.description;d.querySelector("small").textContent=[p.code?"Código: "+p.code:"",p.barcode?"CB: "+p.barcode:""].filter(Boolean).join(" · ");d.onclick=()=>pick(p);$("results").appendChild(d)});$("results").hidden=!matches.length;if(matches.length===1)pick(matches[0])}
function pick(p){selected=p;$("selected").hidden=false;$("selected").textContent=fmt(p);$("qty").value=prefs[key(p)]||10;$("results").hidden=true;$("detail").focus()}
$("search").addEventListener("input",searchNow);$("search").addEventListener("keydown",e=>{if(e.key==="Enter"&&matches.length){pick(matches[0]);e.preventDefault()}});
$("add").onclick=()=>{if(!selected&&matches.length)pick(matches[0]);if(!selected)return alert("Buscá y seleccioná un artículo.");let q=parseInt($("qty").value);if(!q||q<1)return alert("Cantidad inválida.");order.push({qty:q,description:selected.description,detail:$("detail").value.trim()});render();$("search").value="";$("detail").value="";$("qty").value=10;selected=null;matches=[];$("selected").hidden=true;$("results").hidden=true;$("search").focus()};
$("save").onclick=()=>{if(!selected)return alert("Seleccioná un artículo primero.");let q=parseInt($("qty").value);if(!q||q<1)return alert("Cantidad inválida.");prefs[key(selected)]=q;localStorage.setItem("pedidoPrefs",JSON.stringify(prefs));alert("Cantidad habitual guardada: "+q)};
function render(){$("order").innerHTML="";$("empty").hidden=order.length>0;order.forEach((x,i)=>{let d=document.createElement("div");d.className="order";let q=document.createElement("div");q.className="q";q.textContent=x.qty;let t=document.createElement("div");let b=document.createElement("b");b.textContent=x.description;t.appendChild(b);if(x.detail){let s=document.createElement("div");s.className="muted";s.textContent=x.detail;t.appendChild(s)}let del=document.createElement("button");del.className="secondary";del.textContent="×";del.onclick=()=>{order.splice(i,1);render()};d.append(q,t,del);$("order").appendChild(d)})}
$("clear").onclick=()=>{if(order.length&&confirm("¿Borrar todo el pedido?")){order=[];render()}};
$("pdf").onclick=()=>{if(!order.length)return alert("Cargá al menos un artículo.");let text="PEDIDO DE MERCADERÍA\nFecha: "+new Date().toLocaleDateString("es-AR")+"\n\n";order.forEach(x=>text+=x.qty+"  "+x.description+(x.detail?" — "+x.detail:"")+"\n");let blob=new Blob([text],{type:"text/plain;charset=utf-8"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Pedido_"+new Date().toISOString().slice(0,10)+".txt";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
